# GitHub Pages: build Astro → upload artifact → deploy to Pages
# 需在仓库 Settings → Pages → Build and deployment 中选择「GitHub Actions」。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Astro 6 需要 Node >=22.12；GitHub-hosted runner 上的 Node 22/npm
      # 组合在本仓库依赖安装阶段会触发 npm cli 崩溃，因此切到 Node 24。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        # Avoid the npm cli crash seen on the runner's default Node 22 image.
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
